server {
    listen 80;
    server_name infra.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name infra.test;

    ssl_certificate /etc/nginx/ssl/infra.test.crt;
    ssl_certificate_key /etc/nginx/ssl/infra.test.key;
    root /var/www/infralab;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
 }
}
